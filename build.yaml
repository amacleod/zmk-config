# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: nice_nano//zmk
#     shield: reviung41
#   - board: nice_nano//zmk
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: nice_nano//zmk
    shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right

  - board: nice_nano//zmk
    shield: lily58_left nice_view_adapter nice_view
  - board: nice_nano//zmk
    shield: lily58_right nice_view_adapter nice_view

  - board: xiao_ble//zmk
    shield: zaphod_lite

  - board: nice_nano//zmk
    shield: cradio_left
    snippet: zmk-usb-logging
  - board: nice_nano//zmk
    shield: cradio_right

  - board: xiao_ble//zmk
    shield: weejock
    snippet: studio-rpc-usb-uart

  - board: xiao_ble//zmk
    shield: tern_ble

  - board: sparkfun_pro_micro_rp2040//zmk
    shield: cradio_left
    cmake-args: -DCONFIG_MAIN_STACK_SIZE=4096

  - board: xiao_ble//zmk
    shield: apiaster_left
  - board: xiao_ble//zmk
    shield: apiaster_right

  - board: xiao_ble//zmk
    shield: bykeeb_left
  - board: xiao_ble//zmk
    shield: bykeeb_right

  - board: rp2040_zero//zmk
    shield: stratagum
